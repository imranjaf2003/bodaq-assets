<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BODAQ Vinyl Wrap Visualizer</title>
<style>
  :root { --bg:#f5f5f4; --panel:#fff; --line:#e7e5e4; --ink:#1c1917; --muted:#78716c; --accent:#1d4ed8; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  .wrap { max-width:1200px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:0 0 12px; font-weight:600; }
  .stage { display:grid; grid-template-columns:1fr; gap:16px; }
  @media (min-width:860px){ .stage { grid-template-columns:1.5fr 1fr; } }
  .viewer { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; }
  .items { display:flex; gap:8px; margin-bottom:10px; }
  .items button { flex:1; padding:9px; border:1px solid var(--line); background:#fff; border-radius:9px; cursor:pointer; font-weight:600; color:var(--muted); }
  .items button.on { border-color:var(--accent); color:var(--accent); background:#eff6ff; }
  #view { width:100%; aspect-ratio:4/3; border-radius:10px; overflow:hidden; background:#eae8e5; position:relative; touch-action:none; }
  #view canvas { display:block; width:100%; height:100%; }
  #hint { position:absolute; left:10px; bottom:10px; font-size:11px; color:#fff; background:#0006; padding:3px 8px; border-radius:6px; pointer-events:none; }
  #spin { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; }
  .controls { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; }
  .selected { display:flex; align-items:center; gap:10px; padding:8px; border:1px solid var(--line); border-radius:9px; margin-bottom:10px; }
  .selected .chip { width:46px; height:46px; border-radius:7px; border:1px solid #0002; background-size:cover; background-position:center; flex:none; }
  .selected .meta { min-width:0; }
  .selected .meta b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .selected .meta span { color:var(--muted); font-size:12px; }
  #orderBtn { margin-left:auto; padding:8px 12px; background:var(--accent); color:#fff; border-radius:8px; text-decoration:none; font-weight:600; white-space:nowrap; font-size:13px; }
  .filters { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .filters button { padding:5px 10px; border:1px solid var(--line); background:#fff; border-radius:999px; cursor:pointer; font-size:12px; color:var(--muted); }
  .filters button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  #search { width:100%; padding:8px; border:1px solid var(--line); border-radius:8px; margin-bottom:10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(56px,1fr)); gap:6px; max-height:44vh; overflow:auto; padding-right:4px; }
  .sw { aspect-ratio:1/1; border-radius:7px; border:2px solid transparent; cursor:pointer; background-size:cover; background-position:center; }
  .sw.on { border-color:var(--accent); box-shadow:0 0 0 2px #fff inset; }
  .note { font-size:12px; color:var(--muted); margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>See it on your furniture</h1>
  <div class="stage">
    <div class="viewer">
      <div class="items">
        <button data-item="kitchen" class="on">Kitchen</button>
        <button data-item="wardrobe">Wardrobe</button>
        <button data-item="door">Door</button>
      </div>
      <div id="view"><div id="spin">Loading 3D…</div><div id="hint">Drag to rotate · scroll to zoom</div></div>
      <div class="note" id="note">Plain slab fronts — exactly how the wrapping film applies. Colours are approximate; check the physical swatch for an exact match.</div>
    </div>
    <div class="controls">
      <div class="selected">
        <div class="chip" id="selChip"></div>
        <div class="meta"><b id="selName">Pick a colour</b><span id="selSub"></span></div>
        <a id="orderBtn" href="#" target="_top" hidden>Order</a>
      </div>
      <div class="filters" id="filters"></div>
      <input id="search" placeholder="Search name or code…">
      <div class="grid" id="grid"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const SWATCH_BASE = '../swatches/';
const SHOP = new URLSearchParams(location.search).get('shop') || '';
let colors = [], filtered = [], current = null, itemName = 'kitchen';

/* ---------------- Three.js scene ---------------- */
const viewEl = document.getElementById('view');
let renderer, scene, camera, itemGroup, wrappedMeshes = [], texLoader, contactShadow;
let orbit = { az: -0.5, pol: 1.28, dist: 6.2, target: new THREE.Vector3(0, 1.1, 0) };

function initThree(){
  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.LinearToneMapping;
  renderer.toneMappingExposure = 0.92;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  viewEl.appendChild(renderer.domElement);
  texLoader = new THREE.TextureLoader();

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe9e6e2);
  scene.fog = new THREE.Fog(0xe9e6e2, 14, 30);

  camera = new THREE.PerspectiveCamera(33, 1, 0.1, 100);

  // --- lighting: soft, calm, colour-true ---
  const hemi = new THREE.HemisphereLight(0xfdf6ec, 0x9a938a, 0.45);
  scene.add(hemi);
  const key = new THREE.DirectionalLight(0xfff3e6, 1.05);
  key.position.set(-2.5, 9, 3.5);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -6; key.shadow.camera.right = 6;
  key.shadow.camera.top = 8; key.shadow.camera.bottom = -2;
  key.shadow.bias = -0.0004;
  key.shadow.radius = 6;
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xe8ecff, 0.22);
  fill.position.set(6, 3, 3);
  scene.add(fill);
  const amb = new THREE.AmbientLight(0xffffff, 0.32);
  scene.add(amb);

  // --- floor: warm pale oak ---
  const floorMat = new THREE.MeshStandardMaterial({ color:0xc3b49a, roughness:0.4, metalness:0 });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.receiveShadow = true;
  scene.add(floor);
  // --- soft contact shadow blob under the furniture ---
  const sc = document.createElement('canvas'); sc.width = sc.height = 256;
  const sg = sc.getContext('2d');
  const rg = sg.createRadialGradient(128,128,10, 128,128,120);
  rg.addColorStop(0,'rgba(0,0,0,0.55)'); rg.addColorStop(0.55,'rgba(0,0,0,0.28)'); rg.addColorStop(1,'rgba(0,0,0,0)');
  sg.fillStyle = rg; sg.fillRect(0,0,256,256);
  const shadowTex = new THREE.CanvasTexture(sc);
  contactShadow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map:shadowTex, transparent:true, depthWrite:false }));
  contactShadow.rotation.x = -Math.PI/2; contactShadow.position.y = 0.012;
  scene.add(contactShadow);
  // --- back wall: warm off-white ---
  const wallMat = new THREE.MeshStandardMaterial({ color:0xefe9e1, roughness:0.9 });
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(60, 30), wallMat);
  wall.position.set(0, 15, -3.2);
  wall.receiveShadow = true;
  scene.add(wall);

  window.addEventListener('resize', onResize);
  onResize();
  bindOrbit();
  setItem('kitchen');
  animate();
  document.getElementById('spin').remove();
}

function onResize(){
  const w = viewEl.clientWidth, h = viewEl.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h; camera.updateProjectionMatrix();
}

function applyOrbit(){
  orbit.pol = Math.max(1.02, Math.min(1.60, orbit.pol));
  orbit.az  = Math.max(-0.95, Math.min(0.30, orbit.az));
  orbit.dist = Math.max(3.0, Math.min(22, orbit.dist));
  const s = Math.sin(orbit.pol), c = Math.cos(orbit.pol);
  camera.position.set(
    orbit.target.x + orbit.dist * s * Math.sin(orbit.az),
    orbit.target.y + orbit.dist * c,
    orbit.target.z + orbit.dist * s * Math.cos(orbit.az),
  );
  camera.lookAt(orbit.target);
}

function bindOrbit(){
  let drag = false, px=0, py=0;
  viewEl.addEventListener('pointerdown', e=>{ drag=true; px=e.clientX; py=e.clientY; viewEl.setPointerCapture(e.pointerId); });
  viewEl.addEventListener('pointerup', e=>{ drag=false; });
  viewEl.addEventListener('pointermove', e=>{
    if(!drag) return;
    orbit.az  -= (e.clientX - px) * 0.006;
    orbit.pol -= (e.clientY - py) * 0.005;
    px = e.clientX; py = e.clientY;
  });
  viewEl.addEventListener('wheel', e=>{ e.preventDefault(); orbit.dist *= (1 + Math.sign(e.deltaY)*0.08); }, {passive:false});
}

function animate(){ requestAnimationFrame(animate); applyOrbit(); renderer.render(scene, camera); }

/* ---------------- materials ---------------- */
function makeWrapMaterial(){
  return new THREE.MeshStandardMaterial({ color:0xbfbdb9, roughness:0.55, metalness:0.02 });
}
const METAL = new THREE.MeshStandardMaterial({ color:0x3f3a34, roughness:0.35, metalness:0.9 });
const CARCASS = new THREE.MeshStandardMaterial({ color:0x2b2824, roughness:0.7 });
const STONE_TOP = new THREE.MeshStandardMaterial({ color:0xf3f1ec, roughness:0.25, metalness:0.02 });
const FRAME = new THREE.MeshStandardMaterial({ color:0xf6f3ee, roughness:0.8 });

function applyFinish(sw){
  if (!sw || !wrappedMeshes.length) return;
  texLoader.load(SWATCH_BASE + sw.file, (tex)=>{
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = 8;
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    wrappedMeshes.forEach(m=>{
      const g = m.geometry.parameters || {};
      const t = tex.clone(); t.needsUpdate = true;
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.encoding = THREE.sRGBEncoding;
      if (sw.tex){
        // real texture: ~0.75 m of film per swatch tile, grain vertical
        const pw = g.width || 0.5, ph = g.height || 1;
        t.repeat.set(Math.max(1, pw/0.75), Math.max(1, ph/1.0));
      } else {
        t.repeat.set(1, 1); // flat colour swatch — no visible tiling
      }
      const wm = new THREE.MeshStandardMaterial({ map:t, roughness:0.62, metalness:0.0 });
      if (sw.tex){ wm.bumpMap = t; wm.bumpScale = 0.003; }
      m.material.dispose();
      m.material = wm;
    });
  });
}

/* ---------------- furniture (all plain slab fronts) ---------------- */
function slab(w,h,d){ // a plain wrapped front
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), makeWrapMaterial());
  m.castShadow = true; m.receiveShadow = true;
  wrappedMeshes.push(m);
  return m;
}
function box(w,h,d,mat){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.castShadow=true; m.receiveShadow=true; return m; }

const PLINTH_MAT = new THREE.MeshStandardMaterial({ color:0x3f3a34, roughness:0.6 });

function buildKitchen(){
  // luxury villa: floor-to-ceiling handleless cabinet bank + a lower worktop run
  const g = new THREE.Group();
  const GAP = 0.016, D = 0.62, PL = 0.1, H = 2.55;
  const tallCount = 4, tallW = 0.75;        // tall bank on the left
  const runCount = 3, runW = 0.75;          // base run on the right
  const tW = tallCount*tallW, rW = runCount*runW;
  const W = tW + rW, x0 = -W/2;
  const BASE_H = 0.9;

  // one continuous plinth
  const plinth = box(W, PL, D-0.02, PLINTH_MAT); plinth.position.set(0, PL/2, -0.01); g.add(plinth);

  // tall bank
  const tCar = box(tW, H, D, CARCASS); tCar.position.set(x0 + tW/2, PL + H/2, 0); g.add(tCar);
  for (let i=0;i<tallCount;i++){
    const cx = x0 + tallW*(i+0.5);
    const a = slab(tallW-GAP, H*0.6-GAP, 0.024); a.position.set(cx, PL + H*0.30, D/2+0.013); g.add(a);
    const b = slab(tallW-GAP, H*0.38-GAP, 0.024); b.position.set(cx, PL + H*0.80, D/2+0.013); g.add(b);
  }

  // base run + slim stone worktop (open above — no wall units, no big void)
  const rx0 = x0 + tW;
  const rCar = box(rW, BASE_H, D, CARCASS); rCar.position.set(rx0 + rW/2, PL + BASE_H/2, 0); g.add(rCar);
  for (let i=0;i<runCount;i++){
    const f = slab(runW-GAP, BASE_H-GAP, 0.024);
    f.position.set(rx0 + runW*(i+0.5), PL + BASE_H/2, D/2+0.013); g.add(f);
  }
  const topY = PL + BASE_H;
  const top = box(rW+0.06, 0.05, D+0.04, STONE_TOP); top.position.set(rx0 + rW/2, topY+0.025, 0.02); g.add(top);
  // waterfall end panel
  const wf = box(0.05, topY+0.05, D+0.04, STONE_TOP); wf.position.set(rx0 + rW + 0.03, (topY+0.05)/2, 0.02); g.add(wf);

  return { group:g, tilt:0.02 };
}

function buildWardrobe(){
  const g = new THREE.Group();
  const W = 2.6, H = 2.78, D = 0.62, n = 4, GAP = 0.016, cw = W/n, PL = 0.09;
  const wplinth = box(W, PL, D-0.04, PLINTH_MAT); wplinth.position.set(0, PL/2, -0.01); g.add(wplinth);
  const car = box(W, H, D, CARCASS); car.position.set(0, PL+H/2, 0); g.add(car);
  for (let i=0;i<n;i++){
    const dpanel = slab(cw-GAP, H-GAP, 0.028);
    dpanel.position.set(-W/2 + cw*(i+0.5), PL+H/2, D/2+0.015);
    g.add(dpanel);
    if (i<n-1){
      const hd = box(0.01, H*0.42, 0.028, METAL);
      hd.position.set(-W/2 + cw*(i+1) - 0.02, PL+H*0.5, D/2+0.02);
      g.add(hd);
    }
  }
  return { group:g };
}

function buildDoor(){
  // plain slab door + slim frame — both wrapped in the chosen colour
  const g = new THREE.Group();
  const W = 1.0, H = 2.45, T = 0.05, fr = 0.09, fd = 0.16;
  const wallMat = new THREE.MeshStandardMaterial({ color:0xe9e2d7, roughness:0.95 });
  const seg = (w,h,x,y)=>{ const m=box(w,h,0.14,wallMat); m.position.set(x,y,-0.16); m.receiveShadow=true; return m; };
  g.add(seg(2.6, 3.4, -(W/2+fr+1.3), 1.7));
  g.add(seg(2.6, 3.4,  (W/2+fr+1.3), 1.7));
  g.add(seg(5.4, 1.0, 0, H+fr+0.5));
  // frame — wrapped (added to wrappedMeshes via slab-like helper)
  const frameSlab = (w,h,x,y)=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,fd), makeWrapMaterial());
    m.castShadow=true; m.receiveShadow=true; m.position.set(x,y,-0.03); wrappedMeshes.push(m); g.add(m); };
  frameSlab(W+fr*2, fr, 0, H+fr/2);
  frameSlab(fr, H+fr, -(W/2+fr/2), H/2);
  frameSlab(fr, H+fr,  (W/2+fr/2), H/2);
  // door leaf
  const leaf = slab(W-0.008, H-0.008, T);
  leaf.position.set(0, H/2, T/2 + 0.005);
  g.add(leaf);
  // slim bar handle
  const handle = box(0.028, H*0.3, 0.03, METAL);
  handle.position.set(W/2 - 0.08, H*0.48, T + 0.02);
  g.add(handle);
  return { group:g };
}

const BUILDERS = { kitchen:buildKitchen, wardrobe:buildWardrobe, door:buildDoor };

function setItem(name){
  itemName = name;
  document.querySelectorAll('.items button').forEach(b=>b.classList.toggle('on', b.dataset.item===name));
  if (itemGroup) scene.remove(itemGroup);
  wrappedMeshes = [];
  const built = BUILDERS[name]();
  itemGroup = built.group;
  scene.add(itemGroup);
  // fit the contact shadow to the item footprint
  if (built.tilt) itemGroup.rotation.y = built.tilt;
  const bb = new THREE.Box3().setFromObject(itemGroup);
  const sz = bb.getSize(new THREE.Vector3()), ctr = bb.getCenter(new THREE.Vector3());
  contactShadow.scale.set(sz.x + 1.0, sz.z * 3.5 + 0.6, 1);
  contactShadow.position.set(ctr.x, 0.012, 0.15);
  // auto-frame: fit with headroom for the 3/4 angle
  orbit.target.set(ctr.x, ctr.y * 0.88 + 0.15, 0);
  const fov = camera.fov * Math.PI/180;
  const fitH = (sz.y * 1.5) / (2*Math.tan(fov/2));
  const fitW = (sz.x * 0.72) / (2*Math.tan(fov/2));
  orbit.dist = Math.max(fitH, fitW);
  orbit.az = -0.26; orbit.pol = 1.42;
  if (current) applyFinish(current);
}

/* ---------------- colour picker UI ---------------- */
function renderGrid(){
  const el = document.getElementById('grid'); el.innerHTML='';
  filtered.slice(0,500).forEach(c=>{
    const d = document.createElement('div');
    d.className = 'sw' + (current && current.code===c.code ? ' on' : '');
    d.title = `${c.name} (${c.code})`;
    if (c.tex) d.style.backgroundImage = `url(${SWATCH_BASE + c.file})`;
    else d.style.background = c.hex;
    d.onclick = ()=>select(c);
    el.appendChild(d);
  });
}
function applyFilter(){
  const q = document.getElementById('search').value.toLowerCase().trim();
  const cat = document.querySelector('.filters button.on').dataset.cat;
  filtered = colors.filter(c =>
    (cat==='All' || c.cat===cat) &&
    (!q || c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q)));
  renderGrid();
}
function select(c){
  current = c;
  document.getElementById('selChip').style.cssText =
    c.tex ? `background-image:url(${SWATCH_BASE + c.file})` : `background:${c.hex}`;
  document.getElementById('selName').textContent = `${c.name} (${c.code})`;
  document.getElementById('selSub').textContent = `${c.cat} · ${c.sub}`;
  const ob = document.getElementById('orderBtn');
  if (SHOP){ ob.hidden=false; ob.textContent=`Order ${c.code}`; ob.href=`${SHOP}/?s=${encodeURIComponent(c.code)}&post_type=product`; }
  try { parent.postMessage({ type:'bodaq-visualizer-select', code:c.code, name:c.name }, '*'); } catch(e){}
  renderGrid();
  applyFinish(c);
}

async function init(){
  colors = await fetch('./colors.json').then(r=>r.json());
  const cats = ['All', ...[...new Set(colors.map(c=>c.cat))]];
  const fb = document.getElementById('filters');
  cats.forEach((cat,i)=>{ const b=document.createElement('button');
    b.textContent=cat; b.dataset.cat=cat; if(i===0)b.classList.add('on');
    b.onclick=()=>{ document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); applyFilter(); };
    fb.appendChild(b); });
  document.getElementById('search').oninput = applyFilter;
  document.querySelectorAll('.items button').forEach(btn=>{
    btn.onclick = ()=> setItem(btn.dataset.item);
  });
  initThree();

  const qp = new URLSearchParams(location.search);
  if (qp.get('item') && BUILDERS[qp.get('item')]) setItem(qp.get('item'));
  applyFilter();
  const wanted = qp.get('c');
  const pick = (wanted && colors.find(c=>c.code.toLowerCase()===wanted.toLowerCase()))
    || colors.find(c=>c.code==='LW102') || colors[0];
  if (pick){ select(pick); const on = document.querySelector('.sw.on'); if (on) on.scrollIntoView({block:'nearest'}); }
}
init();
</script>
</body>
</html>
